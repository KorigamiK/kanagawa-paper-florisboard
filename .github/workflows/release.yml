name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.flex
          generate_release_notes: true
